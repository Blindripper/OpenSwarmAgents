name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-candidate:
    name: Release candidate checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium

      - name: Run RC smoke and browser checks
        run: npm run check:rc

      - name: Run production Postgres smoke
        run: npm run check:postgres

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Validate Docker Compose files
        run: npm run compose:config
