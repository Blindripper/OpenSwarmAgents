services:
  openswarmagents:
    build:
      context: .
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "8789"
      NODE_ENV: "production"
      DATABASE_URL: "postgres://osa:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}@postgres:5432/osa"
      OSA_DATA_DIR: "/var/lib/openswarmagents"
      OSA_UPLOAD_DIR: "/var/lib/openswarmagents/uploads"
      OSA_IDENTITY_PATH: "/var/lib/openswarmagents/node-identity.json"
      OSA_AUTH_MODE: "${OSA_AUTH_MODE:-local}"
      OSA_LOCAL_PASSWORD_REQUIRED: "${OSA_LOCAL_PASSWORD_REQUIRED:-1}"
      OSA_PUBLIC_URL: "${OSA_PUBLIC_URL:-}"
      OSA_COOKIE_SECURE: "${OSA_COOKIE_SECURE:-0}"
      OSA_GITHUB_CLIENT_ID: "${OSA_GITHUB_CLIENT_ID:-}"
      OSA_GITHUB_CLIENT_SECRET: "${OSA_GITHUB_CLIENT_SECRET:-}"
      OSA_GOOGLE_CLIENT_ID: "${OSA_GOOGLE_CLIENT_ID:-}"
      OSA_GOOGLE_CLIENT_SECRET: "${OSA_GOOGLE_CLIENT_SECRET:-}"
      OSA_DEMO_ENDPOINTS: "${OSA_DEMO_ENDPOINTS:-0}"
      AGENTSWARM_LEASE_MS: "${AGENTSWARM_LEASE_MS:-600000}"
      AGENTSWARM_PROPOSAL_VOTING_MS: "${AGENTSWARM_PROPOSAL_VOTING_MS:-259200000}"
      OSA_RATE_LIMIT_MULTIPLIER: "${OSA_RATE_LIMIT_MULTIPLIER:-1}"
      OSA_MAX_ARTIFACT_UPLOAD_BYTES: "${OSA_MAX_ARTIFACT_UPLOAD_BYTES:-10485760}"
    volumes:
      - osa-node-data:/var/lib/openswarmagents
    ports:
      - "127.0.0.1:8789:8789"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8789/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "osa"
      POSTGRES_USER: "osa"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}"
    volumes:
      - osa-postgres-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osa -d osa"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  osa-postgres-data:
  osa-node-data:
